packages:
  - server
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@colyseus/core@0.18.11'
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - minimatch@11.0.5

# Security fixes for transitive dependencies.
overrides:
  'source-map-js': '^1.2.2'
  'brace-expansion@5': '^5.0.12'
  'minimatch@10': '^11.0.5'
  'body-parser@2': '^2.4.0'
  'proxy-addr': '^2.0.8'
  'qs@6': '^6.16.1'
  'uuid@8': '11.1.1'
  'grant>jwk-to-pem': '-'

# Optional Grant JWK support is unused; its elliptic dependency has no patched release.
